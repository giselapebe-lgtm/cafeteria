<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido de Cafetería</title>
    <link rel="stylesheet" href="cafeteria.css" />
  </head>

  <body>
    <div class="contenedor">
      <h1>☕️ Pedido de Cafetería ☕️</h1>

      <form id="formulario" novalidate>
        <label for="nombre">Nombre del cliente</label>
        <input type="text" id="nombre" name="nombre" />

        <label for="correo">Correo electrónico</label>
        <input type="text" id="correo" name="correo" />

        <div class="fila">
          <div class="campo">
            <label for="producto">Producto</label>

            <select id="producto" name="producto">
              <option value="Café">Café</option>
              <option value="Capuchino">Capuchino</option>
              <option value="Latte">Latte</option>
              <option value="Chai Latte">Chai Latte</option>
              <option value="Chocolate">Chocolate</option>
              <option value="Té">Té</option>
            </select>
          </div>

          <div class="campo">
            <label for="cantidad">Cantidad</label>
            <input
              type="number"
              id="cantidad"
              name="cantidad"
              value="1"
              min="1"
              step="1"
            />
          </div>
        </div>

        <label>Tamaño de la bebida</label>

        <div class="tamanos">
          <label>
            <input
              type="radio"
              name="tamano"
              id="chico"
              value="Chico"
              checked
            />
            Chico
          </label>

          <label>
            <input type="radio" name="tamano" id="mediano" value="Mediano" />
            Mediano
          </label>

          <label>
            <input type="radio" name="tamano" id="grande" value="Grande" />
            Grande
          </label>
        </div>

        <div class="llevar">
          <label>
            <input type="checkbox" id="llevar" name="llevar" checked />
            Pedido para llevar
          </label>
        </div>

        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones"></textarea>

        <div class="botones">
          <button type="reset" class="limpiar">Limpiar</button>

          <button type="submit" class="registrar">Registrar pedido</button>
        </div>
      </form>
    </div>

    <script src="cafeteria.js?v=6"></script>
  </body>
</html>
